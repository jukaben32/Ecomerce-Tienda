<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    admin.html · Panel de administración de ModaNueva
    Solo entran usuarios con rol 'admin' (tabla perfiles en Supabase).
    La seguridad real la dan las reglas RLS de supabase/schema.sql;
    esta página solo oculta lo que no corresponde.
  -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin · ModaNueva</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23B5472B%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2722%27 font-family=%27Georgia%27 font-style=%27italic%27 text-anchor=%27middle%27 fill=%27%23F4EFE6%27%3EM%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&display=swap" rel="stylesheet">
  <!-- Estilos compilados con Tailwind (npm run build) -->
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="bg-papel font-sans text-tinta antialiased">

  <header class="border-b border-tinta/15 bg-papel">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <a href="/admin.html" class="font-display text-xl font-bold">Moda<span class="italic text-arcilla">Nueva</span> <span class="ml-1 text-sm font-sans font-medium text-tinta/60">Admin</span></a>
      <div class="flex items-center gap-2">
        <a href="/" class="boton-sec">Ir a la tienda</a>
        <button id="btnSalirAdmin" type="button" class="boton-sec hidden">Salir</button>
      </div>
    </div>
  </header>

  <!-- Pantalla de acceso (se muestra mientras no haya un admin con sesión) -->
  <section id="pantallaAcceso" class="mx-auto my-16 hidden w-[min(92vw,26rem)] rounded-3xl border border-tinta/15 bg-white/60 p-8">
    <h1 class="font-display text-3xl font-bold">Ingreso administrador</h1>
    <p id="mensajeAcceso" class="mt-2 text-sm text-tinta/60">Usa tu cuenta de administrador.</p>
    <form id="formAcceso" class="mt-6 space-y-4">
      <label class="block text-sm font-medium">Correo
        <input name="correo" type="email" required autocomplete="username" class="campo">
      </label>
      <label class="block text-sm font-medium">Contraseña
        <input name="password" type="password" required autocomplete="current-password" class="campo">
      </label>
      <button type="submit" class="boton-principal w-full">Entrar</button>
    </form>
  </section>

  <!-- Panel (solo visible para admin). Cada pestaña la monta su módulo en js/admin/ -->
  <main id="panelAdmin" class="mx-auto hidden max-w-6xl px-4 py-8">
    <div id="barraPestanas" class="flex gap-1 overflow-x-auto border-b border-tinta/15" role="tablist" aria-label="Secciones del panel"></div>
    <div id="zonaPaneles"></div>
  </main>

  <!-- Selector de imágenes (lo usan Productos y Promociones) -->
  <dialog id="dlgMedios" class="m-auto w-[min(94vw,44rem)] rounded-3xl bg-papel p-0 text-tinta shadow-2xl">
    <div class="p-6">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="font-display text-2xl font-bold">Elige una imagen</h2>
        <button type="button" data-cerrar class="rounded-full px-3 py-1 text-sm hover:bg-crema" aria-label="Cerrar">✕</button>
      </div>
      <div id="gridSelectorMedios" class="grid max-h-[60vh] grid-cols-3 gap-3 overflow-y-auto sm:grid-cols-4"></div>
    </div>
  </dialog>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
